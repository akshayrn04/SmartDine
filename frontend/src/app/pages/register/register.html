<header class="topbar"><a class="brand" routerLink="/">SmartDine</a></header>

<main class="wrap">
  <h1>Create your account</h1>

  <form (ngSubmit)="submit()">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" [(ngModel)]="name" required autocomplete="name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" [(ngModel)]="phone" autocomplete="tel">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password"
           required minlength="8" maxlength="72" autocomplete="new-password">

    <label class="check">
      <input type="checkbox" name="optedIn" [(ngModel)]="optedIn">
      <span>Keep me updated: send me my reservation updates (like confirmations or cancellations) and occasional offers.</span>
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account' : 'Create account' }}
    </button>
  </form>

  <p class="alt">Already have an account? <a routerLink="/login" [queryParams]="{ role: 'customer' }">Sign in</a></p>
</main>
