<header class="topbar"><a class="brand" routerLink="/">SmartDine</a></header>

<main class="wrap">
  <h1>{{ role === 'restaurant' ? 'Restaurant sign in' : 'Sign in to book' }}</h1>

  <form (ngSubmit)="submit()">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required autocomplete="current-password">

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in' : 'Sign in' }}
    </button>
  </form>

  @if (role === 'customer') {
    <p class="alt">New here? <a routerLink="/register">Create an account</a></p>
  }
</main>
